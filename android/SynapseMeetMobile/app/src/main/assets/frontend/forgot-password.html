<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SynapseMeet — Forgot password</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/synapse-logo.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="auth">
  <div class="app-shell">
    <div class="auth-screen">
      <div class="auth-hero">
        <img class="mark" src="assets/icons/synapse-logo.svg" alt="">
        <h1>Forgot password?</h1>
        <p>Enter your email and we’ll send a reset link.</p>
      </div>

      <div id="form-error" class="form-error"></div>
      <div id="form-success" class="form-success" hidden></div>

      <form id="forgot-form">
        <div class="field">
          <label for="reset-email">Email address</label>
          <input id="reset-email" type="email" autocomplete="email" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>

      <div class="auth-switch">
        <a href="index.html">Back to sign in</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sw-register.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const errorBox = document.getElementById('form-error');
      const successBox = document.getElementById('form-success');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('visible');
        successBox.hidden = true;

        const email = document.getElementById('reset-email').value.trim();

        try {
          const response = await SynapseAPI.requestPasswordReset(email);
          successBox.textContent = response.message;
          successBox.hidden = false;
          successBox.classList.add('visible');
          form.reset();
        } catch (err) {
          errorBox.textContent = err.message || 'Unable to send reset link.';
          errorBox.classList.add('visible');
        }
      });
    });
  </script>
</body>
</html>

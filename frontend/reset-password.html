<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SynapseMeet — Reset password</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/synapse-logo.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="auth">
  <div class="app-shell">
    <div class="auth-screen">
      <div class="auth-hero">
        <img class="mark" src="assets/icons/synapse-logo.svg" alt="">
        <h1>Reset password</h1>
        <p>Choose a new password for your SynapseMeet account.</p>
      </div>

      <div id="form-error" class="form-error"></div>
      <div id="form-success" class="form-success" hidden></div>

      <form id="reset-form">
        <div class="field">
          <label for="new-password">New password</label>
          <div class="password-input-wrap">
            <input id="new-password" name="new-password" type="password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-target="new-password" aria-label="Show password" aria-pressed="false" title="Show password">
              <span aria-hidden="true">👁</span>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <div class="password-input-wrap">
            <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-target="confirm-password" aria-label="Show password" aria-pressed="false" title="Show password">
              <span aria-hidden="true">👁</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Update password</button>
      </form>

      <div class="auth-switch">
        <a href="index.html">Back to sign in</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sw-register.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const uid = params.get('uid');
      const token = params.get('token');
      const form = document.getElementById('reset-form');
      const errorBox = document.getElementById('form-error');
      const successBox = document.getElementById('form-success');

      const togglePassword = (inputId) => {
        const input = document.getElementById(inputId);
        const toggle = document.querySelector(`[data-target="${inputId}"]`);
        if (!input || !toggle) return;
        toggle.addEventListener('click', () => {
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          toggle.classList.toggle('is-visible', show);
          toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
          toggle.setAttribute('aria-pressed', String(show));
          toggle.title = show ? 'Hide password' : 'Show password';
        });
      };

      togglePassword('new-password');
      togglePassword('confirm-password');

      if (!uid || !token) {
        errorBox.textContent = 'This reset link is invalid or expired.';
        errorBox.classList.add('visible');
        form.querySelector('button[type="submit"]').disabled = true;
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('visible');
        successBox.hidden = true;

        const password = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (password !== confirmPassword) {
          errorBox.textContent = 'Passwords do not match.';
          errorBox.classList.add('visible');
          return;
        }

        try {
          await SynapseAPI.confirmPasswordReset(uid, token, password);
          successBox.textContent = 'Password updated successfully. Redirecting to sign in…';
          successBox.hidden = false;
          successBox.classList.add('visible');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } catch (err) {
          errorBox.textContent = err.message || 'Could not reset your password.';
          errorBox.classList.add('visible');
        }
      });
    });
  </script>
</body>
</html>

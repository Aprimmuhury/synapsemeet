<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SynapseMeet — Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/synapse-logo.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .topbar-avatar-link {
    --size: 36px;
  }

  .join-form {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .field--join {
    flex: 1;
    margin-bottom: 0;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body data-page="dashboard">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><img src="assets/icons/synapse-logo.svg" alt=""> Synapse<span class="accent">Meet</span></div>
      <a href="profile.html" class="synapse-ring topbar-avatar-link"><div class="avatar" id="topbar-avatar">•</div></a>
    </header>

    <main class="screen">
      <div class="screen-header">
        <span class="eyebrow">Welcome back</span>
        <h1><span id="greeting-name">there</span> 👋</h1>
        <p class="sub">Here's what's happening across your meetings.</p>
      </div>

      <form id="join-by-code-form" class="card join-form">
        <div class="field field--join">
          <label for="room-code-input">Join with a room code</label>
          <input id="room-code-input" type="text" placeholder="e.g. kx7-qpz">
        </div>
        <button type="submit" class="btn btn-secondary">Join</button>
      </form>

      <div class="section-title">Your meetings</div>
      <div id="meeting-list"></div>
      <div id="empty-state" class="empty-state hidden">
        <strong>No meetings yet</strong>
        Tap the + button to schedule your first AI-assisted meeting.
      </div>
    </main>

    <button id="fab-new-meeting" class="fab" aria-label="New meeting">+</button>

    <nav class="bottom-nav">
      <a href="dashboard.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Home
      </a>
      <a href="meeting-create.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 10l6 4-6 4z" fill="currentColor" stroke="none"/></svg>
        Schedule
      </a>
      <a href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        Profile
      </a>
    </nav>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

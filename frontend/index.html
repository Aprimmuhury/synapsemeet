<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SynapseMeet — Sign in</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/synapse-logo.svg">
<link rel="apple-touch-icon" href="assets/icons/synapse-logo.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="auth" data-default-auth-mode="login">
  <div class="app-shell">
    <div class="auth-screen">
      <div class="auth-hero">
        <img class="mark" src="assets/icons/synapse-logo.svg" alt="">
        <h1>SynapseMeet</h1>
        <p>AI-powered meetings that take their own notes.</p>
      </div>

      <div class="auth-switcher" aria-label="Authentication mode selector">
        <button type="button" class="auth-toggle is-active" data-mode="login">Sign in</button>
        <button type="button" class="auth-toggle" data-mode="register">Sign up</button>
      </div>

      <div id="form-error" class="form-error"></div>

      <div class="auth-panel-group">
        <div class="auth-panel active" data-mode="login">
          <form id="login-form">
            <div class="field">
              <label for="username">Username</label>
              <input id="username" name="username" type="text" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="password-input-wrap">
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false" title="Show password">
                  <span aria-hidden="true">👁</span>
                </button>
              </div>
            </div>
            <div class="form-actions-inline">
              <a href="forgot-password.html" class="text-link">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign in</button>
          </form>
        </div>

        <div class="auth-panel" data-mode="register" hidden>
          <form id="register-form">
            <div class="field">
              <label for="reg-display-name">Display name</label>
              <input id="reg-display-name" type="text" required>
            </div>
            <div class="field">
              <label for="reg-username">Username</label>
              <input id="reg-username" type="text" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="reg-email">Email</label>
              <input id="reg-email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="reg-password">Password</label>
              <div class="password-input-wrap">
                <input id="reg-password" type="password" autocomplete="new-password" required>
                <button type="button" class="password-toggle" data-target="reg-password" aria-label="Show password" aria-pressed="false" title="Show password">
                  <span aria-hidden="true">👁</span>
                </button>
              </div>
              <p class="field-hint">Use at least 8 characters.</p>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Create account</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
